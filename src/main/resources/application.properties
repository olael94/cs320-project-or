quarkus.quinoa.package-manager=pnpm
quarkus.quinoa.package-manager-install=false
quarkus.quinoa.ui-dir=src/main/frontend
quarkus.quinoa.enable-spa-routing=true

# AWS Lambda configuration
quarkus.lambda.handler=io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
quarkus.lambda.endpoint-mode=http-api

# Database configuration
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:mysql://cs320db-ecommerce.c1kkoo8gsl55.us-west-2.rds.amazonaws.com:3306/ecommerce_db
%dev.quarkus.datasource.jdbc.url=jdbc:mysql://cs320db-ecommerce.c1kkoo8gsl55.us-west-2.rds.amazonaws.com:3306/ecommerce_db?sslMode=DISABLED
%dev.quarkus.http.idle-timeout=2s
quarkus.hibernate-orm.database.generation=update

# Cookie configuration to avoid issues when running in dev mode
app.cookie.secure=true
%dev.app.cookie.secure=false

quarkus.mailer.from=onboarding@resend.dev
quarkus.mailer.host=smtp.resend.com
quarkus.mailer.port=587
quarkus.mailer.username=resend
quarkus.mailer.password=${RESEND_API_KEY}
quarkus.mailer.start-tls=REQUIRED

app.base-url=https://yourapp.com
%dev.app.base-url=http://localhost:8080
# Quarkus Mailer defaults to mock=true in dev mode regardless of other config,
# so it must be explicitly disabled here to actually send via Resend locally.
%dev.quarkus.mailer.mock=false